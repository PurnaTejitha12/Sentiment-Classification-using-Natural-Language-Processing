<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Sentiment Analyzer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #222;
            overflow-x: hidden;
        }

        /* Animated Background */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.25;
            animation: float 8s infinite ease-in-out;
        }

        .circle:nth-child(1) {
            width: 250px;
            height: 250px;
            background: #fff;
            top: 5%;
            left: 5%;
        }

        .circle:nth-child(2) {
            width: 350px;
            height: 350px;
            background: #ff9a9e;
            right: 5%;
            bottom: 5%;
            animation-delay: 2s;
        }

        .circle:nth-child(3) {
            width: 150px;
            height: 150px;
            background: #a1c4fd;
            left: 45%;
            top: 40%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }

            50% {
                transform: translateY(-40px) translateX(25px);
            }
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 850px;
            margin: 50px auto;
        }

        /* Header */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .header .icon {
            font-size: 55px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .header h1 {
            font-size: 42px;
            margin: 10px 0;
        }

        .header p {
            font-size: 17px;
            opacity: 0.9;
        }

        /* Glass Card */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(15px);
        }

        /* Text Area */
        .input-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 160px;
            resize: none;
            border: 2px solid #e5e7eb;
            border-radius: 15px;
            padding: 18px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }

        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        #counter {
            color: #777;
            font-size: 13px;
        }

        /* Example Buttons */
        .examples {
            margin-top: 18px;
        }

        .examples p {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .example-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            margin: 4px;
            cursor: pointer;
            background: #f0f0ff;
            color: #555;
            transition: 0.25s;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            font-family: inherit;
        }

        .analyze-btn {
            flex: 1;
            border: none;
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: 0.3s;
        }

        .analyze-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .clear-btn {
            padding: 15px 25px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .clear-btn:hover {
            background: #f5f5f5;
        }

        /* Result */
        .result {
            display: none;
            margin-top: 30px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            text-align: center;
            margin-bottom: 20px;
            color: #444;
        }

        .sentiment {
            text-align: center;
            padding: 25px;
            border-radius: 18px;
            background: #f8f8ff;
            margin-bottom: 20px;
        }

        .emoji {
            font-size: 60px;
        }

        .sentiment h2 {
            font-size: 28px;
            margin-top: 8px;
        }

        .sentiment p {
            margin-top: 5px;
            color: #777;
        }

        /* Score Bars */
        .score {
            margin-top: 20px;
        }

        .score-item {
            margin-bottom: 15px;
        }

        .score-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .bar {
            height: 10px;
            background: #eee;
            border-radius: 20px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 20px;
            transition: width 1s ease;
        }

        .positive-bar {
            background: linear-gradient(90deg, #22c55e, #86efac);
        }

        .negative-bar {
            background: linear-gradient(90deg, #ef4444, #fca5a5);
        }

        .neutral-bar {
            background: linear-gradient(90deg, #64748b, #cbd5e1);
        }

        /* Footer */
        .footer {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 13px;
            opacity: 0.8;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                width: 94%;
                margin: 25px auto;
            }

            .header h1 {
                font-size: 30px;
            }

            .card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

            .clear-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Animated Background -->
    <div class="background">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="icon">🧠</div>
            <h1>AI Sentiment Analyzer</h1>
            <p>Discover the emotion behind your text</p>
        </div>

        <!-- Main Card -->
        <div class="card">

            <div class="input-header">
                <span>Enter your text</span>
                <span id="counter">0 / 500</span>
            </div>

            <textarea
                id="textInput"
                maxlength="500"
                placeholder="Type something like: I absolutely love this product! It is amazing..."
                oninput="updateCounter()">
            </textarea>

            <!-- Examples -->
            <div class="examples">
                <p>Try an example:</p>

                <button class="example-btn"
                    onclick="useExample('I absolutely love this product! It is amazing and wonderful.')">
                    😊 Positive
                </button>

                <button class="example-btn"
                    onclick="useExample('I hate this product. It is terrible and disappointing.')">
                    😡 Negative
                </button>

                <button class="example-btn"
                    onclick="useExample('The product arrived today. It works as expected.')">
                    😐 Neutral
                </button>
            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button class="analyze-btn" onclick="analyzeSentiment()">
                    ✨ Analyze Sentiment
                </button>

                <button class="clear-btn" onclick="clearText()">
                    🗑 Clear
                </button>

            </div>

            <!-- Result -->
            <div class="result" id="result">

                <h3 class="result-title">Analysis Result</h3>

                <div class="sentiment">
                    <div class="emoji" id="emoji">😊</div>

                    <h2 id="sentimentText">Positive</h2>

                    <p id="description">
                        Your text has a positive tone.
                    </p>
                </div>

                <!-- Score -->
                <div class="score">

                    <div class="score-item">
                        <div class="score-label">
                            <span>😊 Positive</span>
                            <span id="positiveScore">0%</span>
                        </div>

                        <div class="bar">
                            <div
                                class="bar-fill positive-bar"
                                id="positiveBar">
                            </div>
                        </div>
                    </div>

                    <div class="score-item">
                        <div class="score-label">
                            <span>😡 Negative</span>
                            <span id="negativeScore">0%</span>
                        </div>

                        <div class="bar">
                            <div
                                class="bar-fill negative-bar"
                                id="negativeBar">
                            </div>
                        </div>
                    </div>

                    <div class="score-item">
                        <div class="score-label">
                            <span>😐 Neutral</span>
                            <span id="neutralScore">0%</span>
                        </div>

                        <div class="bar">
                            <div
                                class="bar-fill neutral-bar"
                                id="neutralBar">
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>

        <div class="footer">
            Sentiment Analyzer • Built with HTML, CSS & JavaScript
        </div>

    </div>

    <script>

        const positiveWords = [
            "good",
            "great",
            "excellent",
            "amazing",
            "awesome",
            "wonderful",
            "love",
            "loved",
            "like",
            "liked",
            "happy",
            "best",
            "fantastic",
            "perfect",
            "beautiful",
            "enjoy",
            "enjoyed",
            "nice",
            "brilliant",
            "success",
            "successful",
            "fun",
            "easy",
            "helpful"
        ];

        const negativeWords = [
            "bad",
            "terrible",
            "awful",
            "horrible",
            "hate",
            "hated",
            "sad",
            "angry",
            "worst",
            "poor",
            "disappointing",
            "disappointed",
            "boring",
            "difficult",
            "fail",
            "failed",
            "failure",
            "problem",
            "wrong",
            "useless",
            "annoying",
            "broken"
        ];

        function updateCounter() {

            const text = document.getElementById("textInput").value;

            document.getElementById("counter").textContent =
                text.length + " / 500";
        }


        function useExample(text) {

            document.getElementById("textInput").value = text;

            updateCounter();

            analyzeSentiment();
        }


        function analyzeSentiment() {

            let text =
                document.getElementById("textInput").value
                .toLowerCase();

            if (text.trim() === "") {

                alert("Please enter some text first!");

                return;
            }

            // Remove punctuation
            text = text.replace(/[.,!?;:'"()]/g, "");

            const words = text.split(/\s+/);

            let positive = 0;
            let negative = 0;

            words.forEach(word => {

                if (positiveWords.includes(word)) {
                    positive++;
                }

                if (negativeWords.includes(word)) {
                    negative++;
                }

            });

            let total = positive + negative;

            let positivePercentage;
            let negativePercentage;
            let neutralPercentage;

            if (total === 0) {

                positivePercentage = 0;
                negativePercentage = 0;
                neutralPercentage = 100;

            } else {

                positivePercentage =
                    Math.round((positive / total) * 100);

                negativePercentage =
                    Math.round((negative / total) * 100);

                neutralPercentage =
                    100 - positivePercentage - negativePercentage;
            }

            let sentiment;
            let emoji;
            let description;

            if (positive > negative) {

                sentiment = "Positive";
                emoji = "😊";
                description =
                    "Your text has a positive and optimistic tone.";

            } else if (negative > positive) {

                sentiment = "Negative";
                emoji = "😞";
                description =
                    "Your text has a negative or critical tone.";

            } else {

                sentiment = "Neutral";
                emoji = "😐";
                description =
                    "Your text appears to have a neutral tone.";
            }

            // Show result
            document.getElementById("result").style.display = "block";

            document.getElementById("emoji").textContent = emoji;

            document.getElementById("sentimentText").textContent =
                sentiment;

            document.getElementById("description").textContent =
                description;

            document.getElementById("positiveScore").textContent =
                positivePercentage + "%";

            document.getElementById("negativeScore").textContent =
                negativePercentage + "%";

            document.getElementById("neutralScore").textContent =
                neutralPercentage + "%";

            // Reset bars
            document.getElementById("positiveBar").style.width = "0%";
            document.getElementById("negativeBar").style.width = "0%";
            document.getElementById("neutralBar").style.width = "0%";

            // Animate bars
            setTimeout(() => {

                document.getElementById("positiveBar").style.width =
                    positivePercentage + "%";

                document.getElementById("negativeBar").style.width =
                    negativePercentage + "%";

                document.getElementById("neutralBar").style.width =
                    neutralPercentage + "%";

            }, 100);
        }


        function clearText() {

            document.getElementById("textInput").value = "";

            document.getElementById("counter").textContent = "0 / 500";

            document.getElementById("result").style.display = "none";

            document.getElementById("positiveBar").style.width = "0%";
            document.getElementById("negativeBar").style.width = "0%";
            document.getElementById("neutralBar").style.width = "0%";
        }

    </script>

</body>
</html>
