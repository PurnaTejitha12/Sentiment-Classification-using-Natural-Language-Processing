<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Sentiment Analyzer</h2>

    <textarea id="text"
        placeholder="Enter your sentence..."></textarea>

    <br>

    <button onclick="analyzeSentiment()">Analyze Sentiment</button>

    <div id="result"></div>
</div>

<script>
    function analyzeSentiment() {

        let text = document.getElementById("text").value.toLowerCase();

        const positiveWords = [
            "good", "great", "excellent", "happy",
            "love", "amazing", "awesome", "wonderful",
            "best", "nice"
        ];

        const negativeWords = [
            "bad", "terrible", "hate", "sad",
            "awful", "worst", "poor", "angry",
            "horrible", "disappointed"
        ];

        let positiveScore = 0;
        let negativeScore = 0;

        let words = text.split(/\s+/);

        words.forEach(word => {

            // Remove punctuation
            word = word.replace(/[.,!?]/g, "");

            if (positiveWords.includes(word)) {
                positiveScore++;
            }

            if (negativeWords.includes(word)) {
                negativeScore++;
            }
        });

        let result = document.getElementById("result");

        if (positiveScore > negativeScore) {
            result.innerHTML = "😊 Positive Sentiment";
            result.style.color = "green";

        } else if (negativeScore > positiveScore) {
            result.innerHTML = "😞 Negative Sentiment";
            result.style.color = "red";

        } else {
            result.innerHTML = "😐 Neutral Sentiment";
            result.style.color = "gray";
        }
    }
</script>

</body>
</html>
